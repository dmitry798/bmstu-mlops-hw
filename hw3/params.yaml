# Единственная точка конфигурации ДЗ 3.
# Ни один путь, порог или размер среза не должен появляться в коде строкой.
#
# Источник: iamtarun/python_code_instructions_18k_alpaca (HuggingFace),
# 18 612 строк в формате alpaca: instruction / input / output / prompt.
# Задача: генерация Python-кода по текстовому описанию.

collect:
  # Версия датасета переключается ЗДЕСЬ. Всё остальное — следствие.
  version: "v2"              # v1 | v2
  n_rows: 20000              # верхняя отсечка на файл-источник; реальный объём
                             # определяют фильтры и max_per_topic, а не она
  sources:
    # Шарды готовит scripts/fetch_dataset.py: он скачивает parquet с HF
    # и режет его на две равные детерминированные части.
    # v1 — половина источника, v2 — источник целиком.
    # Лежат внутри репозитория (data/ под DVC, в git не попадают): так их видит
    # dvc как deps стадии collect и замечает подмену источника.
    v1:
      - "data/source/0000.parquet"
    v2:
      - "data/source/0000.parquet"
      - "data/source/0001.parquet"

  # --- Переработка источника ---
  # Чужой готовый набор — сырьё, а не сдача. Параметры ниже — то, чем этот
  # датасет отличается от «скачал parquet и переименовал в raw.jsonl».
  # Каждый отражён числом в metrics/collect.json и разобран в docs/datasheet.md.

  topics: null               # null — все темы таксономии (src/topics.py);
                             # список — сузить набор до своей предметной области.
                             # Сужение законно, но следите за diversity.min_groups.

  drop_untagged: true        # строка, которую таксономия не смогла отнести ни
                             # к одной теме, выбрасывается, а не сваливается
                             # в корзину «other». Корзина «other» мгновенно
                             # пробивает diversity.max_group_share и, что важнее,
                             # делает групповой сплит бессмысленным: в одной
                             # группе оказывается всё подряд.

  verify_output_syntax: true # сверять ответ с разметкой источника. Здесь ответ —
                             # код, и его корректность проверяется ast.parse.
                             # В источнике часть примеров обрезана на полуслове
                             # или содержит markdown-обрамление; такие строки
                             # выбрасываются и попадают в счётчик, а не в обучение.
                             # Чужую разметку не принимаем на веру.

  strip_code_fences: true    # снять ```python … ``` вокруг ответа, если есть:
                             # разметка markdown в целевом тексте — это шум,
                             # который модель заучит как часть ответа.

  max_per_topic: 30          # балансировка: не более N примеров на тему.
                             # Без неё крупнейшая тема занимает заметную долю
                             # набора и решает за весь датасет — ровно то,
                             # что ловит diversity.max_group_share.

  min_output_lines: 1        # ответ короче — не код, а обрывок

  system_prompts:            # В источнике инструкция-обёртка ОДНА на все 18k
                             # строк (колонка prompt начинается одним и тем же
                             # «Below is an instruction...»). Модель, обученная
                             # на одной формулировке, заучивает её как константу
                             # и ломается от перефраза. Поэтому инструкция
                             # разведена на варианты; вариант выбирается
                             # детерминированно по id примера.
    - "Ты пишешь код на Python по текстовому описанию задачи. В ответе — только код, без пояснений и без markdown-обрамления."
    - "Перед тобой задача на программирование. Напиши решение на Python. Выведи только исходный код, ничего не комментируя."
    - "Ты — помощник по Python. Получив описание задачи, верни рабочую реализацию на Python. Ответ должен содержать код и ничего кроме кода."
    - "Задача: реализовать на Python то, что описано ниже. Ответь одним фрагментом кода, без вступлений и заключений."
    - "Ты генерируешь Python-код по спецификации на естественном языке. В ответе допустим только код; пояснения выноси в комментарии внутри кода."

clean:
  # Фильтр длин: слишком короткий пример — обрезок, слишком длинный — выброс.
  min_user_chars: 30
  max_user_chars: 4000
  min_assistant_chars: 5     # порог намеренно низкий: содержательную проверку
                             # ответа делает collect (ast.parse + min_output_lines),
                             # а здесь фильтр длин обязан оставаться универсальным
                             # фильтром длин, а не вторым валидатором кода
  near_dup:
    enabled: true
    shingle_words: 4         # длина словного шингла
    num_perm: 64             # перестановок MinHash: точность против скорости
    threshold: 0.85          # Жаккар выше порога — почти-дубль
  pii:
    enabled: true            # стадия обязательна, даже если счётчик нулевой

diversity:
  # Пороги, которым обязан удовлетворять ОЧИЩЕННЫЙ датасет. Стадия diversity
  # падает, если нарушен хоть один: набор из 30 однотипных строк проходит
  # и схему, и дедупликацию, и сплит — формально он безупречен и бесполезен.
  #
  # Пороги — не догма, но менять их можно только с обоснованием
  # в docs/datasheet.md. «Снизил, чтобы позеленело» — не обоснование.

  min_examples: 1000         # строк после очистки
  min_system_prompts: 3      # различных системных промптов
  min_groups: 50             # различных групп (split.group_key)
  max_group_share: 0.10      # доля крупнейшей группы
  min_answer_len_ratio: 1.6  # p90/p10 длин ответа ассистента
  max_same_length_share: 0.25   # доля примеров с самой частой длиной ответа
  max_duplicate_answer_share: 0.30  # доля ответов-повторов (точные совпадения)

split:
  # Группа сплита. Темы не должны разъезжаться по train/test: внутри одной темы
  # задания — парафразы друг друга («напиши функцию сортировки списка» ×30),
  # и случайный сплит гарантированно разложит парафразы по разные стороны.
  group_key: "topic"
  ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  seed: 42

contamination:
  # Порог поиска near-dup пересечений train/test.
  # Обязан совпадать с clean.near_dup.threshold. Более строгий порог здесь
  # ловил бы не контаминацию, а разницу порогов.
  threshold: 0.85

paths:
  raw: "data/raw.jsonl"
  clean: "data/clean.jsonl"
  train: "data/train.jsonl"
  val: "data/val.jsonl"
  test: "data/test.jsonl"
  metrics_collect: "metrics/collect.json"
  metrics_clean: "metrics/clean.json"
  metrics_split: "metrics/split.json"
  metrics_diversity: "metrics/diversity.json"
  datasheet: "docs/datasheet.md"
