# Optional template, local scripts/check.py is the actually executed CI.
name: hw8910-fast
on: [push, pull_request]
jobs:
  fast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hw8910-broken
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-fast.lock
      - run: python scripts/check.py
# No remote run or branch protection is claimed.
