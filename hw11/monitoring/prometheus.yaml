global:
  scrape_interval: 2s
  evaluation_interval: 2s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
- job_name: hw11-pods
  kubernetes_sd_configs: [{role: pod}]
  relabel_configs:
  - {source_labels: [__meta_kubernetes_namespace], regex: hw11, action: keep}
  - {source_labels: [__meta_kubernetes_pod_label_app], regex: hw11-api, action: keep}
  - {source_labels: [__meta_kubernetes_pod_container_port_number], regex: '8000', action: keep}
  - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
  - {source_labels: [__meta_kubernetes_namespace], target_label: namespace}
- job_name: cadvisor
  scheme: https
  authorization: {credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token}
  tls_config: {ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt}
  kubernetes_sd_configs: [{role: node}]
  relabel_configs:
  - {target_label: __address__, replacement: kubernetes.default.svc:443}
  - {source_labels: [__meta_kubernetes_node_name], target_label: __metrics_path__, regex: '(.+)', replacement: '/api/v1/nodes/$1/proxy/metrics/cadvisor'}
- job_name: kube-state
  static_configs: [{targets: ['hw11-state:8080']}]
