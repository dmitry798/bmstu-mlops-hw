groups:
- name: hw11
  rules:
  - alert: HW11HighTTFC
    expr: (histogram_quantile(0.95, sum by (le) (rate(hw11_ttfc_seconds_bucket[30s]))) > 1.0) and (sum(increase(hw11_ttfc_seconds_count[30s])) >= 20)
    for: 10s
    labels: {severity: warning}
    annotations: {summary: 'Completed simulated streams p95 TTFC >1s; at least 20 samples/30s'}
  - alert: HW11RejectionFraction
    expr: (sum(rate(hw11_requests_total{outcome="rejected"}[30s])) / sum(rate(hw11_requests_total[30s])) > 0.1) and (sum(increase(hw11_requests_total[30s])) >= 20)
    for: 10s
    labels: {severity: warning}
    annotations: {summary: 'Rejected fraction >10%; at least 20 terminal outcomes/30s'}
