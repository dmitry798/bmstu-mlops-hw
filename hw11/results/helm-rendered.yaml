# Source: hw11/templates/api.yaml
apiVersion: apps/v1
kind: Deployment
metadata: {name: hw11-api}
spec:
  replicas: 2
  minReadySeconds: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector: {matchLabels: {app: hw11-api}}
  template:
    metadata:
      labels: {app: hw11-api, model: "A"}
    spec:
      terminationGracePeriodSeconds: 45
      containers:
      - name: api
        image: hw11-api:1.1
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8000, name: http}]
        resources:
          requests: {cpu: 250m, memory: 128Mi}
          limits: {cpu: '1', memory: 256Mi}
        env:
        - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
        - {name: WARMUP_SECONDS, value: "20"}
        - {name: NEVER_READY, value: "false"}
        - {name: MAX_RUNNING, value: "1"}
        - {name: MAX_WAITING, value: "6"}
        - {name: CACHE_CAPACITY, value: "8"}
        - {name: CACHE_HIT_CPU, value: "0.015"}
        - {name: CACHE_MISS_CPU, value: "0.14"}
        - {name: CHUNK_CPU, value: "0.01"}
        startupProbe:
          httpGet: {path: '/startup', port: http}
          periodSeconds: 1
          failureThreshold: 90
        readinessProbe:
          httpGet: {path: '/ready', port: http}
          periodSeconds: 1
          failureThreshold: 1
        livenessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 5
          failureThreshold: 3
        lifecycle:
          preStop:
            httpGet: {path: /drain, port: http}
        volumeMounts: [{name: model, mountPath: /models, readOnly: true}]
      volumes:
      - name: model
        configMap: {name: 'hw11-model-a'}
