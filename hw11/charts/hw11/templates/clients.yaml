{{ range $i := until 4 }}
apiVersion: v1
kind: Pod
metadata: {name: hw11-client-{{ $i }}, labels: {app: hw11-client, client: '{{ $i }}'}}
spec:
  containers:
  - name: client
    image: {{ $.Values.image }}
    imagePullPolicy: IfNotPresent
    command: [python, '-m', uvicorn, 'app.client:app', '--host', '0.0.0.0', '--port', '9000']
    env:
    - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
    - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: hw11-client-{{ $i }}}
spec:
  selector: {app: hw11-client, client: '{{ $i }}'}
  ports: [{port: 9000, targetPort: 9000}]
---
{{ end }}
